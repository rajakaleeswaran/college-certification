<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certification Uploader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Static top logo with reserved padding */
    body {
      margin: 0;
      padding-top: 180px; /* reserve space for the top logo */
      font-family: Arial, Helvetica, sans-serif;
      background: url('DJI_0063.JPEG') no-repeat center center fixed;
      background-size: cover;
    }
    * { box-sizing: border-box; }

    /* Top-center logo, now in normal flow above container */
    .logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 550px;
      max-width: 90%;
      height: auto;
      z-index: 100;
    }

    /* Container flow under logo */
    .container {
      position: absolute;
      top: 200px; /* adjust to sit just below the logo */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      z-index:50;
      
    }
    

    /* Header bar */
    .header {
      background-color: #5f9ea0;
      color: white;
      text-align: center;
      padding: 16px 0;
    }
    .header h2 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

    /* Tabs */
    .tabs {
  display: flex;
  border-bottom: 2px solid #5f9ea0;
  /* optional small gap between tabs: */
  gap: 1px;
  background-color: #6ca9aa;
  border: solid #eef;
}

.tabs button {
  flex: 5;
  padding: 12px 0;
  background: none;
  border: none;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s;
}

/* vertical separator on all but the last tab */
.tabs button:not(:last-child) {
  border-right: 3px solid #eef;
  
}

/* active tab styling */
.tabs button.active {
  background-color: #5f9ea0;
  font-weight: bold;
}

    /* Outer layer wrapper with slight tint */
    .outer-layer {
      padding: 16px;
      transition: background-color 0.5s ease;
      background-color: rgba(95,158,160,0.1);
    }
    .outer-layer.staff-active { background-color: rgba(108,169,170,0.1); }

    /* Form with fade animation */
    .form-container1 {
      text-align: left;
      transition: opacity 0.5s ease;
      opacity: 1;
    }
    .form-container1.fading { opacity: 0; }

    .input-group { margin-bottom: 16px; }
    .input-group label { font-weight: bold; color: #333; display: block; margin-bottom: 6px; }
    .input-group input {
      width: 100%; padding: 12px;
      border: 1px solid #ccc; border-radius: 4px;
      background: #f9f9f9; transition: background 0.3s;
    }
    .input-group input:focus { background: #eef; outline: none; }

    /* Login and forgot */
    .btn {
      width: 100%; padding: 14px;
      background-color: #4CAF50; color: white;
      border: none; border-radius: 4px;
      font-size: 1rem; cursor: pointer;
      transition: opacity 0.3s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .forgot { text-align: center; margin-top: 12px; font-size: 0.9rem; }
    .forgot a { color: #0066cc; text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }

    /* Popup (unchanged) */
    .form-popup { display: none; position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); z-index: 200; width: 90%; max-width: 360px; }
  </style>
</head>
<body>

  <!-- Logo at top-center (absolute) -->
  <img src="logo1.png" alt="Logo" class="logo">

  <div class="container">
    <div class="header">
      <h2>CERTIFICATION UPLOADER</h2>
    </div>
    <div class="tabs">
      <button id="studentTab" class="active">STUDENT</button>
      <button id="staffTab">STAFF</button>
    </div>
    <div class="outer-layer student-active" id="outerLayer">
      <form method="post" action="upload.php" class="form-container1" id="loginForm">
        <input type="hidden" name="loginType" id="loginType" value="student">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Register No." required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="DD-MM-YYYY" required>
        </div>
        <button type="submit" class="btn" name="login_user">Login</button>
        <div class="forgot" onclick="openForm()">Forgot Password <a>Click Here</a>.</div>
      </form>
    </div>
  </div>

  <!-- Forgot Password Popup -->
  <div class="form-popup" id="myForm">
    <form action="login.php" class="form-container1" method="post" style="background:#fff;">
      <h3 style="text-align:center; margin-top:0;">Forgot Password</h3>
      <div class="input-group">
        <label for="userid">User ID</label>
        <input type="text" id="userid" name="userid" placeholder="Enter User ID" required>
      </div>
      <div class="input-group">
        <label for="mail">Email</label>
        <input type="text" id="mail" name="mail" placeholder="Enter Email" required>
      </div>
      <button type="submit" class="btn" name="forgot_pass">Send Email</button>
      <button type="button" class="btn cancel" style="background:red; margin-top:8px;" onclick="closeForm()">Close</button>
    </form>
  </div>

  <script>
    const studentTab = document.getElementById('studentTab');
    const staffTab = document.getElementById('staffTab');
    const loginType = document.getElementById('loginType');
    const formEl = document.getElementById('loginForm');
    const outerLayer = document.getElementById('outerLayer');

    function switchTab(type) {
      formEl.classList.add('fading');
      setTimeout(() => {
        loginType.value = type;
        if (type === 'student') {
          studentTab.classList.add('active'); staffTab.classList.remove('active');
          outerLayer.classList.add('student-active'); outerLayer.classList.remove('staff-active');
        } else {
          staffTab.classList.add('active'); studentTab.classList.remove('active');
          outerLayer.classList.add('staff-active'); outerLayer.classList.remove('student-active');
        }
        formEl.classList.remove('fading');
      }, 300);
    }
    studentTab.addEventListener('click', () => switchTab('student'));
    staffTab.addEventListener('click', () => switchTab('staff'));

    function openForm() { document.getElementById('myForm').style.display = 'block'; }
    function closeForm() { document.getElementById('myForm').style.display = 'none'; }
  </script>
</body>
</html>
